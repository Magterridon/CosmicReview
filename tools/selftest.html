<!doctype html><meta charset="utf-8"><title>selftest</title>
<style>body{font:13px monospace;background:#111;color:#eee;margin:0}iframe{border:0;position:absolute;left:-9999px;top:0}</style>
<pre id="out">running…</pre>
<iframe id="f" src="/le-projet/" width="1440" height="900"></iframe>
<script>
const log = [];
const ok = (name, cond, extra) => log.push((cond ? "PASS " : "FAIL ") + name + (extra !== undefined && !cond ? "  << " + extra : ""));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById("f");

f.addEventListener("load", async () => {
  try { await run(); } catch (e) { log.push("ERROR " + e.message + "\n" + e.stack); }
  document.getElementById("out").textContent = log.join("\n");
});

async function run() {
  const d = f.contentDocument, w = f.contentWindow;
  const scene = d.querySelector(".scene--projet");
  const line = d.querySelector(".pj-line");
  const credit = d.querySelector(".pj-credit");
  const count = d.querySelector("[data-count]");
  const live = d.querySelector("#pj-live");
  const cour = [...d.querySelectorAll(".pj-elements--cour .pj-el")];
  const dsr = [...d.querySelectorAll(".pj-elements--desert .pj-el")];
  const byId = (id) => d.querySelector(".pj-el--" + id);

  /* --- l'état de départ : la cour, six éléments --- */
  ok("scène présente", !!scene);
  ok("six éléments dans la cour", cour.length === 6, cour.length);
  ok("trois éléments dans le désert", dsr.length === 3, dsr.length);
  ok("scène active au chargement", scene.hasAttribute("data-active"));
  ok("on démarre dans la cour", scene.dataset.state === "cour", scene.dataset.state);
  ok("le désert est caché", dsr.every((b) => b.offsetParent === null));

  const says = d.querySelectorAll(".pj-source .pj-say").length;
  ok("les 18 répliques sont dans le HTML (sans JS)", says === 18, says);

  /* --- zones réellement cliquables, élément par élément --- */
  const probes = {
    arthur: [0.45, 0.55], axel: [0.5, 0.5], telescope: [0.5, 0.45],
    camera: [0.5, 0.2], fenetre: [0.25, 0.5], carnet: [0.5, 0.5],
    "axel-seul": [0.5, 0.5], jeep: [0.55, 0.55], panneau: [0.5, 0.15],
  };
  const hitTest = (list) => list.forEach((b) => {
    const id = b.dataset.el, r = b.getBoundingClientRect(), p = probes[id];
    const hit = d.elementFromPoint(r.left + r.width * p[0], r.top + r.height * p[1]);
    const owner = hit && hit.closest ? hit.closest(".pj-el") : null;
    ok("clic réel sur « " + id + " »", owner === b, owner ? owner.dataset.el : "rien");
  });
  hitTest(cour);

  /* --- une réplique s'écrit --- */
  byId("arthur").click();
  await sleep(200);
  ok("l'écriture démarre", line.textContent.length > 0, JSON.stringify(line.textContent));
  await sleep(9000);
  ok("réplique complète", /on les aura toutes/.test(line.textContent), line.textContent);
  ok("crédit affiché", credit.classList.contains("is-on") && /Louis Bachetti/.test(credit.textContent), credit.textContent);
  ok("annonce lecteur d'écran", live.textContent.length > 40, live.textContent.length);
  ok("compteur 1/6", count.textContent === "1/6", count.textContent);
  ok("l'amorce s'efface", d.querySelector(".pj-cue").classList.contains("is-off"));

  /* --- la porte de secours apparaît à mi-parcours --- */
  for (const id of ["axel", "telescope"]) { byId(id).click(); await sleep(9000); }
  ok("compteur 3/6", count.textContent === "3/6", count.textContent);
  ok("« fin de l'enregistrement » proposé", !d.querySelector("[data-end]").hidden);
  ok("aucun bouton de retour n'existe", !d.querySelector("[data-rewind]"));

  /* --- ce qui se cache derrière les objets ne gêne pas la scène --- */
  ok("le carnet dort", d.querySelector(".cn").hidden && getComputedStyle(d.querySelector(".cn")).display === "none");
  ok("la cassette dort", d.querySelector(".cs").hidden && getComputedStyle(d.querySelector(".cs")).display === "none");
  hitTest(cour);

  /* --- les six ont parlé : l'éclair part tout seul --- */
  for (const id of ["camera", "fenetre", "carnet"]) { byId(id).click(); await sleep(9000); }
  // le fondu dure une dizaine de secondes : c'est le sujet, on l'attend
  await sleep(13000);
  ok("le fondu mène au désert", scene.dataset.state === "desert", scene.dataset.state);

  const freeze = () => { const st = d.createElement("style"); st.id = "freeze";
    st.textContent = "*{transition:none!important;animation:none!important}"; d.head.appendChild(st);
    void d.body.offsetWidth; return () => st.remove(); };

  let unfreeze = freeze();
  ok("la cour a disparu", cour.every((b) => b.offsetParent === null));
  ok("le désert est là", dsr.every((b) => b.offsetParent !== null));
  ok("le ciel n'est plus voilé", getComputedStyle(d.querySelector(".pj-sky")).filter === "none",
     getComputedStyle(d.querySelector(".pj-sky")).filter);
  ok("le désert est délavé", getComputedStyle(d.querySelector(".pj-viewport")).filter !== "none",
     getComputedStyle(d.querySelector(".pj-viewport")).filter);
  ok("les traits du désert sont pâlis",
     parseFloat(getComputedStyle(d.querySelector(".pj-el--jeep .ch")).opacity) < 0.5,
     getComputedStyle(d.querySelector(".pj-el--jeep .ch")).opacity);
  ok("le titre du film apparaît", parseFloat(getComputedStyle(d.querySelector(".pj-filmtitle")).opacity) > 0.5,
     getComputedStyle(d.querySelector(".pj-filmtitle")).opacity);
  unfreeze();

  ok("le compteur tombe à 0/3", count.textContent === "0/3", count.textContent);
  ok("l'ardoise passe au vlog 51", /51/.test(d.querySelector(".pj-vlog").textContent), d.querySelector(".pj-vlog").textContent);
  ok("le lieu devient le Nevada", /NV/.test(d.querySelector(".pj-place").textContent), d.querySelector(".pj-place").textContent);
  ok("la porte de secours est retirée", d.querySelector("[data-end]").hidden);
  ok("l'amorce annonce ce qui reste", /trois/i.test(d.querySelector("[data-hint]").textContent), d.querySelector("[data-hint]").textContent);

  hitTest(dsr);

  /* --- le désert parle --- */
  byId("jeep").click();
  await sleep(9000);
  ok("réplique du désert", /moteur tourne/.test(line.textContent), line.textContent);
  ok("compteur 1/3", count.textContent === "1/3", count.textContent);

  /* --- sans retour --- */
  const before = scene.dataset.state;
  d.querySelector(".pj-transcript").click();
  await sleep(600);
  ok("rien ne ramène à la cour", scene.dataset.state === before, scene.dataset.state);

  /* --- le film en trois lignes --- */
  d.querySelector("[data-info]").click();
  await sleep(600);
  const panel = d.querySelector(".pj-panel");
  ok("panneau synopsis ouvert", !panel.hidden && panel.classList.contains("is-open"));
  ok("focus dans le panneau", panel.contains(d.activeElement), d.activeElement && d.activeElement.className);
  d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  await sleep(700);
  ok("panneau fermé par Échap", panel.hidden);

  /* --- navigation sans rechargement --- */
  const navs = w.performance.getEntriesByType("navigation").length;
  d.querySelector(".scene--projet .scene-back").click();
  await sleep(1200);
  ok("passage au ciel sans rechargement", d.body.dataset.scene === "ciel" && w.location.pathname === "/",
     d.body.dataset.scene + " " + w.location.pathname);
  w.history.back();
  await sleep(1200);
  ok("bouton Précédent revient au Projet", d.body.dataset.scene === "le-projet", d.body.dataset.scene);
  ok("aucune entrée de navigation en plus", w.performance.getEntriesByType("navigation").length === navs);
  ok("le désert est resté le désert", scene.dataset.state === "desert", scene.dataset.state);

  /* --- le temps qui passe --- */
  const tc1 = d.querySelector(".pj-tc").textContent;
  await sleep(2500);
  ok("timecode qui avance", d.querySelector(".pj-tc").textContent !== tc1,
     tc1 + " → " + d.querySelector(".pj-tc").textContent);
}
</script>
